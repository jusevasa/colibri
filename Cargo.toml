[package]
name = "colibri"
version = "0.1.0"
edition = "2024"
description = "Terminal rápida para correr varios agentes"

[dependencies]
alacritty_terminal = "0.26"
block2 = "0.6"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "clipboard", "system_fonts"] }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
